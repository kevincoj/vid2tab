  leave = () => {
    along = false; cancelAnimationFrame(ticking); player?.destroy(); removeEventListener('blur', windowBlur);
    document.removeEventListener('keydown', keys, true); removeEventListener('resize', resized); refit.disconnect();
    document.removeEventListener('fullscreenchange', fsChange); document.removeEventListener('visibilitychange', wake);
    clearTimeout(hideTimer); lock?.release().catch(() => {});
    document.body.classList.remove('playing');
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  };
  draw();
};

// ---- progress -------------------------------------------------------------------------------

screens.make = async function makeScreen(name) {
  const sheet = await api('/api/sheets/' + enc(name));
  document.title = sheet.title + ' · Vid2Tab';
  const bar = h('div');
  const title = h('h1', { class: 'serif' }, sheet.title);
  const sub = h('div', { class: 'muted' }, sheet.artist);
  const steps = h('ul', { class: 'jobs' });
  const message = h('div');
  const buttons = h('div', { class: 'row' });
  const log = h('pre', { class: 'log' });
  const logBox = h('details', {}, h('summary', {}, 'Details'), log);
  app.append(bar, h('div', { class: 'wrap' }, h('div', { class: 'progress' }, title, sub, steps, message, logBox, h('div', { style: 'height:16px' }), buttons)));
  let timer = null, stopped = false;
  leave = () => { stopped = true; clearTimeout(timer); };
  const setBar = kind => bar.replaceChildren(stepsBar(kind === 'video' ? 2 : 4, backLink('#/', 'Your sheets')));

  const action = async (what, body = {}) => {
    try { await api(`/api/sheets/${enc(name)}/${what}`, body); } catch (error) { toast(error.message); }
    tick();
  };
  const tick = async () => {
    clearTimeout(timer);
    if (stopped) return;
    let p;
    try { p = await api(`/api/sheets/${enc(name)}/progress`); } catch (error) { message.textContent = error.message; return; }
    if (stopped) return;
    setBar(p.kind || (p.state === 'needs-video' ? 'video' : 'sheet'));
    if (p.running) {
      draw(p);
      message.replaceChildren(p.warnings_so_far ? h('div', { class: 'muted' }, plural(p.warnings_so_far, 'thing') + ' to check so far') : '');
      buttons.replaceChildren(h('span', { class: 'spacer' }), h('button', { type: 'button', onclick: () => action('cancel') }, 'Cancel'));
      timer = setTimeout(tick, 1000);
      return;
    }
    // not running: decide what comes next from the outcome and the sheet's state
    if (p.outcome === 'done' && p.kind === 'video') { location.hash = '#/crop/' + enc(name); return; }
    if ((p.outcome === 'done' || !p.outcome) && (p.state === 'done' || p.state === 'failed')) { location.hash = '#/sheet/' + enc(name); return; }
    if (p.steps.length) draw(p); else steps.replaceChildren();
    const why = p.outcome === 'cancelled' ? 'Stopped.' : p.outcome === 'failed' && p.bot_check
      ? h('span', {}, 'YouTube asked to confirm you\u2019re not a bot, so the video could not be downloaded. ',
          `Turn on \u201c${SIGN_IN}\u201d in `, h('a', { href: '#/settings' }, 'Settings'), ', then try again.')
      : p.outcome === 'failed'
      ? (p.kind === 'video' ? (sheet.file ? 'The video file could not be read. Is it complete, and a video?' : 'The video could not be fetched. Check the link and your internet connection.')
         : 'Something went wrong while making the sheet. The details below say what.')
      : { 'needs-video': 'The video has not been fetched yet.', 'needs-crop': 'The video is ready; the music area is not chosen yet.',
          'unfinished': 'The sheet is not finished.' }[p.state] || '';
    message.replaceChildren(h('div', { class: p.outcome === 'failed' ? 'notice bad' : 'muted' }, why));
    if (p.outcome === 'failed') logBox.open = true;
    buttons.replaceChildren(h('span', { class: 'spacer' }), continueButton(p, () => p.state === 'needs-crop' ? (location.hash = '#/crop/' + enc(name)) : action('continue')));
  };
  const draw = p => {
    steps.replaceChildren(...p.steps.map(s => {
      const li = h('li', { class: s.state }, h('span', { class: 'dot' }, s.state === 'done' ? icon('check') : s.state === 'failed' || s.state === 'cancelled' ? icon('close') : ''),
        s.label, s.state === 'active' && h('span', { class: 'detail' }, [p.detail, clock(p.elapsed)].filter(Boolean).join(' · ')));
      return s.state === 'active' && p.percent != null ? [li, h('div', { class: 'bar' }, h('div', { style: `width:${p.percent * 100}%` }))] : li;
    }).flat());
    if (p.log_tail) log.textContent = p.log_tail.join('\n');
  };
  tick();
};

function continueButton(p, onclick) {
  const label = p.state === 'needs-video' ? 'Get the video again' : p.state === 'needs-crop' ? 'Choose the music area' : 'Continue';
  return h('button', { type: 'button', class: 'primary', onclick }, p.outcome === 'failed' ? 'Try again' : label);
}

// ---- box editor (crop and masks) ------------------------------------------------------------
// Boxes are [left, top, right, bottom] in the picture's own pixels (natW x natH). Only outlines and,
// on the selected box, small handles are drawn over the picture.

function boxEditor(picture, natW, natH, { boxes = [], multi = false, kind = '', onchange = () => {} }) {
  const layer = h('div', { class: 'box-layer' });
  picture.append(layer);
  let list = boxes.map(b => b.slice()), selected = multi ? -1 : 0, drag = null;
  const MIN = 6;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const pct = (v, of) => (v / of * 100) + '%';
  function render() {
    layer.replaceChildren(...list.map((b, i) => {
      const el = h('div', { class: `box ${kind} ${i === selected ? 'selected' : ''}`, 'data-i': i });
      Object.assign(el.style, { left: pct(b[0], natW), top: pct(b[1], natH), width: pct(b[2] - b[0], natW), height: pct(b[3] - b[1], natH) });
      if (i === selected) for (const edge of ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w']) el.append(h('div', { class: 'handle', 'data-edge': edge }));
      return el;
    }));
  }
  const point = e => {
    const r = layer.getBoundingClientRect();
    return [clamp((e.clientX - r.left) / r.width * natW, 0, natW), clamp((e.clientY - r.top) / r.height * natH, 0, natH)];
  };
  layer.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const [x, y] = point(e);
    const boxEl = e.target.closest('.box');
    const edge = e.target.dataset.edge;
    layer.setPointerCapture(e.pointerId);
    if (boxEl) {
      selected = +boxEl.dataset.i;
      drag = { mode: edge ? 'resize' : 'move', edge: edge || '', x, y, start: list[selected].slice() };
    } else {
      const before = list.map(b => b.slice());
      if (multi) { list.push([x, y, x, y]); selected = list.length - 1; } else { list = [[x, y, x, y]]; selected = 0; }
      drag = { mode: 'draw', x, y, before };
    }
    render();
    e.preventDefault();
  });
  layer.addEventListener('pointermove', e => {
    if (!drag) return;
    const [x, y] = point(e);
    if (drag.mode === 'draw') {
      list[selected] = [Math.min(x, drag.x), Math.min(y, drag.y), Math.max(x, drag.x), Math.max(y, drag.y)];
    } else if (drag.mode === 'move') {
      const s = drag.start, w = s[2] - s[0], hgt = s[3] - s[1];
      const l = clamp(s[0] + x - drag.x, 0, natW - w), t = clamp(s[1] + y - drag.y, 0, natH - hgt);
      list[selected] = [l, t, l + w, t + hgt];
    } else {
      const s = drag.start.slice();
      if (drag.edge.includes('w')) s[0] = Math.min(x, s[2] - MIN);
      if (drag.edge.includes('e')) s[2] = Math.max(x, s[0] + MIN);
      if (drag.edge.includes('n')) s[1] = Math.min(y, s[3] - MIN);
      if (drag.edge.includes('s')) s[3] = Math.max(y, s[1] + MIN);
      list[selected] = s;
    }
    render();
  });
  const end = () => {
    if (!drag) return;
    const b = list[selected];
    if (drag.mode === 'draw' && (b[2] - b[0] < MIN || b[3] - b[1] < MIN)) {   // a click, not a drag
      list = drag.before; selected = multi ? -1 : 0;
    }
    drag = null;
    list = list.map(b => b.map(Math.round));
    render(); onchange(list);
  };
  layer.addEventListener('pointerup', end);
  layer.addEventListener('pointercancel', end);
  render();
  return {
    get boxes() { return list.map(b => b.slice()); },
    set(boxes) { list = boxes.map(b => b.slice()); selected = multi ? -1 : 0; render(); onchange(list); },
    remove(i) { list.splice(i, 1); selected = -1; render(); onchange(list); },
    select(i) { selected = i; render(); },
    get selected() { return selected; },
    hide(on) { layer.classList.toggle('hide', on); },
  };
}

function momentStrip(name, view, current, pick) {
  const strip = h('div', { class: 'moments' });
  const draw = index => strip.replaceChildren(...view.moments.map(m =>
    h('button', { class: 'moment' + (m.index === index ? ' on' : ''), type: 'button', title: 'Show the video at ' + clock(Math.round(m.time)),
                  onclick: () => { pick(m.index); draw(m.index); } },
      h('img', { src: `/api/sheets/${enc(name)}/frame/${m.index}.jpg?w=240`, alt: '', loading: 'lazy' }),
      h('span', {}, clock(Math.round(m.time))))));
  draw(current);
  return strip;
}

// ---- music area and watermarks --------------------------------------------------------------

screens.crop = async function cropScreen(name) {
  const bar = h('div');
  const holder = h('div', { class: 'wrap' }, h('div', { class: 'empty' }, 'Looking for the TAB in the video…'));
  app.append(bar, holder);
  const [sheet, view] = await Promise.all([api('/api/sheets/' + enc(name)), api(`/api/sheets/${enc(name)}/frames`)]);
  document.title = sheet.title + ' · Vid2Tab';
  const state = { crop: view.crop.slice(), masks: view.masks.map(m => m.slice()) };
  const back = sheet.pdf ? backLink('#/sheet/' + enc(name), 'Back to the sheet') : backLink('#/', 'Your sheets');
  let keys = null;
  const unlisten = () => { if (keys) { document.removeEventListener('keydown', keys); document.removeEventListener('keyup', keys); } };
  leave = unlisten;
  const listen = fn => {
    unlisten();
    keys = e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A' || e.code === 'Space' && e.target.tagName !== 'INPUT') fn(e); };
    document.addEventListener('keydown', keys); document.addEventListener('keyup', keys);
  };

  function stepCrop() {
    bar.replaceChildren(stepsBar(2, back));
    const img = h('img', { src: `/api/sheets/${enc(name)}/frame/${view.shown}.jpg`, alt: 'A frame from the video' });
    const picture = h('div', { class: 'picture' }, img);
    picture.style.maxWidth = `calc(55vh * ${view.width / view.height})`;     // the whole frame and the buttons in view
    const editor = boxEditor(picture, view.width, view.height, { boxes: [state.crop], onchange: b => { state.crop = b[0]; } });
    let hidden = false;
    const hide = h('button', { type: 'button', onclick: () => { hidden = !hidden; editor.hide(hidden); hide.textContent = hidden ? 'Show the box' : 'Hide the box'; } }, 'Hide the box');
    const warn = view.warnings.length ? h('div', { class: 'warnline' }, view.found ? `The TAB was found in only ${view.found} of ${view.samples} moments of the video; check that the box fits.`
      : 'No TAB staff was found, so the box starts as the bottom half of the video. Draw it around the TAB.') : null;
    holder.replaceChildren(h('div', { class: 'crop' },
      h('div', {}, h('h1', { class: 'serif' }, 'Choose the music area'),
        h('p', { class: 'lede' }, view.saved ? 'This is the area the sheet was made from. ' : 'We guessed where the TAB is. ',
          'Drag the box or its corners so it holds the TAB staff with the chord names and numbers above it. Drag anywhere else to draw a new box.')),
      warn, picture,
      h('div', {}, h('div', { class: 'muted small', style: 'margin-bottom:4px' }, 'Other moments in the video (check the box fits them all):'),
        momentStrip(name, view, view.shown, i => { img.src = `/api/sheets/${enc(name)}/frame/${i}.jpg`; })),
      h('div', { class: 'row' },
        h('button', { type: 'button', onclick: () => editor.set([view.guess]) }, 'Back to our guess'), hide,
        h('span', { class: 'muted small' }, 'or hold Space to see the frame'),
        h('span', { class: 'spacer' }),
        h('button', { type: 'button', class: 'primary', onclick: stepMasks }, 'Next: watermarks', icon('next')))));
    listen(e => {
      if (e.code === 'Space') { editor.hide(e.type === 'keydown' || hidden); e.preventDefault(); }
      if (e.type === 'keydown' && e.key === 'Enter') stepMasks();
    });
  }

  function stepMasks() {
    bar.replaceChildren(stepsBar(3, back));
    const [L, T, R, B] = state.crop, W = R - L, H = B - T;
    state.masks = state.masks.filter(m => m[0] < R && m[2] > L && m[1] < B && m[3] > T)
      .map(m => [Math.max(m[0], L), Math.max(m[1], T), Math.min(m[2], R), Math.min(m[3], B)]);
    const canvas = h('canvas', { width: W, height: H });
    const picture = h('div', { class: 'picture' }, canvas);
    picture.style.maxWidth = `min(${Math.max(W * 2.5, 400)}px, calc(55vh * ${W / H}))`;   // enlarge at most 2.5x, keep in view
    let frameIndex = view.mask_frame, image = new Image(), result = false;
    const paint = () => {
      const ctx = canvas.getContext('2d');
      ctx.drawImage(image, L, T, W, H, 0, 0, W, H);
      if (result) { ctx.fillStyle = '#fff'; for (const m of editor.boxes) ctx.fillRect(m[0], m[1], m[2] - m[0], m[3] - m[1]); }
    };
    const load = i => { image = new Image(); image.onload = paint; image.src = `/api/sheets/${enc(name)}/frame/${i}.jpg`; };
    const chips = h('div', { class: 'chips' });
    const local = state.masks.map(m => [m[0] - L, m[1] - T, m[2] - L, m[3] - T]);
    const drawChips = boxes => {
      chips.replaceChildren(...(boxes.length ? boxes.map((b, i) => h('span', { class: 'chip' + (i === editor?.selected ? ' on' : '') },
        h('span', { style: 'cursor:pointer', onclick: () => { editor.select(i); drawChips(editor.boxes); } }, `Box ${i + 1}`),
        h('button', { type: 'button', title: 'Remove this box', 'aria-label': `Remove box ${i + 1}`, onclick: () => editor.remove(i) }, icon('close'))))
        : [h('span', { class: 'muted small' }, 'No boxes yet.')]));
    };
    const editor = boxEditor(picture, W, H, { boxes: local, multi: true, kind: 'mask',
      onchange: boxes => { state.masks = boxes.map(m => [m[0] + L, m[1] + T, m[2] + L, m[3] + T]); drawChips(boxes); if (result) paint(); } });
    drawChips(local);
    const toggle = h('input', { type: 'checkbox', id: 'result', onchange: e => { result = e.target.checked; editor.hide(result); paint(); } });
    const make = h('button', { type: 'button', class: 'primary' }, 'Make the sheet', icon('next'));
    const error = h('div', { class: 'error hidden' });
    const submit = async masks => {
      make.disabled = true; error.classList.add('hidden');
      try {
        await api(`/api/sheets/${enc(name)}/crop`, { crop: state.crop, masks });
        location.hash = '#/make/' + enc(name);
      } catch (err) { error.textContent = err.message; error.classList.remove('hidden'); make.disabled = false; }
    };
    make.addEventListener('click', () => submit(state.masks));
    holder.replaceChildren(h('div', { class: 'crop' },
      h('div', {}, h('h1', { class: 'serif' }, 'Cover watermarks and logos'),
        h('p', { class: 'lede' }, 'Optional. Drag a box over anything in the music area that is not music: a channel logo, a watermark, a subscribe button. ',
          'It is painted out in every frame; music under a see-through logo is recovered.')),
      picture,
      h('div', { class: 'row' }, chips, h('span', { class: 'spacer' }),
        h('label', { class: 'row small', style: 'gap:6px;cursor:pointer' }, toggle, 'Show the result')),
      h('div', {}, h('div', { class: 'muted small', style: 'margin-bottom:4px' }, 'Other moments (a logo may appear only later):'),
        momentStrip(name, view, frameIndex, i => { frameIndex = i; load(i); })),
      error,
      h('div', { class: 'row' },
        h('button', { type: 'button', onclick: stepCrop }, icon('back'), 'Back'),
        h('span', { class: 'spacer' }),
        h('button', { type: 'button', onclick: () => submit([]) }, 'No watermarks'),
        make)));
    load(frameIndex);
    listen(e => {
      if (e.type !== 'keydown') return;
      if ((e.key === 'Delete' || e.key === 'Backspace') && editor.selected >= 0) { editor.remove(editor.selected); e.preventDefault(); }
      if (e.key === 'Enter') make.click();
    });
  }
  stepCrop();
};

route();
</script>
