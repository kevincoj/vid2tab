<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vid2Tab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 36'%3E%3Cpath d='M16 34C9 26 2 18 2 10 2 4 8 2 16 2s14 2 14 8c0 8-7 16-14 24z' fill='%235c7041'/%3E%3Cpath d='M12.6 9.6v9.8c0 .8.9 1.3 1.6.8l7.3-4.9c.6-.4.6-1.2 0-1.6l-7.3-4.9c-.7-.5-1.6 0-1.6.8z' fill='%23fcfbf4'/%3E%3C/svg%3E">
<script>
  // Theme before first paint: 'light', 'dark', 'night' or (no setting) the system's light or dark.
  try { const t = localStorage.getItem('vid2tab.theme'); if (['light', 'dark', 'night'].includes(t)) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
@font-face { font-family: Fraunces; src: url(/fonts/fraunces.woff2) format('woff2'); font-weight: 400 600; font-display: swap; }
@font-face { font-family: Figtree; src: url(/fonts/figtree.woff2) format('woff2'); font-weight: 400 700; font-display: swap; }

/* Matcha latte (light), Matcha dark and Night. Every colour on the page comes from these tokens.
   Pages (covers, sheet, play mode) are the PDF's black-on-white images laid on --paper: multiplied in light and
   dark (dark dims the paper), inverted in Night (light notes on a dark page). Print is always black on white. */
:root {
  --ground: #eeebdf; --band: #e3dfc9; --surface: #f7f5ec; --paper: #fcfbf4; --field: #fcfbf4;
  --ink: #2a2a20; --soft: #5c5b4d; --line: #d8d3bf; --line-strong: #bdb79f;
  --act: #5c7041; --act-ink: #ffffff; --act-text: #4c5f35; --act-soft: #e3e8d3;
  --mark: #5c7041; --mark-cut: #fcfbf4;
  --chk: #94561a; --chk-soft: #f2e4cf; --bad: #a3352a; --bad-soft: #f5dfda;
  --box: #4fb34a; --mask: #f08a24; --cover-dim: none; --cover-back: brightness(.97);
  --page-filter: none; --page-blend: multiply; --page-note: #5c5b4d;
  --follow-tint: rgba(92,112,65,.16); --follow-mark: #5c7041;     /* play along: the line being played, ring and playhead */
  --loop-tint: rgba(196,132,38,.16); --loop-mark: #a8681a;         /* play along: the looped measures */
  --shadow-page: 0 1px 1px rgba(40,35,20,.10), 0 2px 4px rgba(40,35,20,.06), 0 16px 22px -14px rgba(40,35,20,.42);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --ground: #1d1c17; --band: #26251e; --surface: #24231d; --paper: #e8e4d4; --field: #2b2a22;
    --ink: #ece9dc; --soft: #b1ac9a; --line: #3b392f; --line-strong: #57543f;
    --act: #b4c88e; --act-ink: #1c2311; --act-text: #c0d29d; --act-soft: #333a26;
    --mark: #bacd96; --mark-cut: #26251e;
    --chk: #e8b06a; --chk-soft: #3a2f1e; --bad: #f0948a; --bad-soft: #3d2420;
    --box: #8fd14f; --cover-dim: brightness(.9); --cover-back: brightness(.7);
    --follow-tint: rgba(92,112,65,.2); --follow-mark: #4c5f35;
    --loop-tint: rgba(196,132,38,.2); --loop-mark: #8f5712;
    --shadow-page: 0 1px 2px rgba(0,0,0,.4), 0 16px 24px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme=dark], :root[data-theme=night] {
  --ground: #1d1c17; --band: #26251e; --surface: #24231d; --paper: #e8e4d4; --field: #2b2a22;
  --ink: #ece9dc; --soft: #b1ac9a; --line: #3b392f; --line-strong: #57543f;
  --act: #b4c88e; --act-ink: #1c2311; --act-text: #c0d29d; --act-soft: #333a26;
  --mark: #bacd96; --mark-cut: #26251e;
  --chk: #e8b06a; --chk-soft: #3a2f1e; --bad: #f0948a; --bad-soft: #3d2420;
  --box: #8fd14f; --cover-dim: brightness(.9); --cover-back: brightness(.7);
  --follow-tint: rgba(92,112,65,.2); --follow-mark: #4c5f35;
  --loop-tint: rgba(196,132,38,.2); --loop-mark: #8f5712;
  --shadow-page: 0 1px 2px rgba(0,0,0,.4), 0 16px 24px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
:root[data-theme=night] {
  --paper: #2a2923; --cover-dim: none; --cover-back: brightness(.8); --page-note: #b1ac9a;
  --page-filter: invert(.9) hue-rotate(180deg) sepia(.1); --page-blend: lighten;
  --follow-tint: rgba(180,200,142,.13); --follow-mark: #b4c88e;
  --loop-tint: rgba(232,178,96,.14); --loop-mark: #e8b260;
}
@media print { :root, :root[data-theme] { --paper: #fff; --cover-dim: none; --page-filter: none; --page-blend: multiply; } }

* { box-sizing: border-box; }
html { background: var(--ground); }
body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.5 Figtree, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; }
::selection { background: var(--act-soft); color: var(--ink); }
a { color: inherit; }
.serif { font-family: Fraunces, Georgia, serif; font-variation-settings: "SOFT" 100; font-weight: 500; }
h1, h2, h3 { text-wrap: balance; }
.hidden { display: none !important; }
.muted { color: var(--soft); }
.small { font-size: 14px; }
.spacer { flex: 1; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* top bar and the tinted band that some screens continue */
.band { background: var(--band); }
header.top { height: 72px; display: flex; align-items: center; gap: 24px; padding: 0 clamp(16px, 4vw, 56px); }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; letter-spacing: -.02em; text-decoration: none; }
.logo svg { height: 34px; width: auto; }
.wrap { padding: 0 clamp(16px, 4vw, 56px); max-width: 1440px; margin: 0 auto; }

/* controls */
button, .button { font: inherit; font-weight: 600; font-size: 15px; height: 42px; padding: 0 16px; border-radius: 6px;
  border: 1.5px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
button:hover, .button:hover { border-color: var(--line-strong); }
button.primary, .button.primary { background: var(--act); border-color: var(--act); color: var(--act-ink); font-weight: 700; }
button.primary:hover, .button.primary:hover { filter: brightness(1.06); }
button:disabled { opacity: .55; cursor: default; filter: none; }
button.link, .link { height: auto; border: 0; background: none; padding: 0; color: var(--ink); font-weight: 600;
  text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 4px; }
button.link:hover, a.link:hover { text-decoration-color: currentColor; }
button.icon { width: 40px; padding: 0; }
button.quiet { border-color: transparent; background: none; color: var(--soft); }
button.quiet:hover { color: var(--ink); border-color: var(--line); }
input[type=text], input[type=url], input[type=search] { font: inherit; font-size: 16px; width: 100%; height: 48px; padding: 0 14px;
  border: 1.5px solid var(--line); border-radius: 6px; background: var(--field); color: var(--ink); }
input::placeholder { color: var(--soft); opacity: 1; }
input:focus { outline: none; border-color: var(--act); box-shadow: 0 0 0 3px var(--act-soft); }
button:focus-visible, .button:focus-visible, a:focus-visible, .cover:focus-visible, label.choice:focus-within {
  outline: 2.5px solid var(--act); outline-offset: 2px; }
input[type=text].bad, input[type=url].bad { border-color: var(--bad); }
.error { color: var(--bad); font-size: 14.5px; font-weight: 600; margin-top: 6px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px; }
.notice { border-radius: 6px; padding: 12px 14px; background: var(--act-soft); }
.notice.bad { background: var(--bad-soft); }
.empty { padding: 48px 20px; text-align: center; color: var(--soft); }
.empty h2 { color: var(--ink); margin: 0 0 6px; font-size: 24px; }

/* ---- home ---- */
.start { padding-top: 18px; padding-bottom: 34px; }
.start h1 { font-size: clamp(30px, 4vw, 42px); line-height: 1.1; letter-spacing: -.015em; margin: 0 0 16px; }
.paste { display: flex; gap: 12px; max-width: 980px; }
.paste input { height: 64px; font-size: 18px; padding: 0 20px; border-width: 2px; border-color: var(--act); border-radius: 8px; }
.paste button { height: 64px; font-size: 18px; padding: 0 28px; border-radius: 8px; }
.alt { margin-top: 12px; color: var(--soft); font-size: 15px; }
body.dragging .start { outline: 2.5px dashed var(--act); outline-offset: -10px; }

.cont { display: flex; align-items: center; gap: 20px; padding-top: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.cont .lbl { color: var(--soft); font-size: 14px; width: 128px; flex: none; }
.cont .cover { width: 58px; flex: none; }
.cont .t { font-size: 22px; line-height: 1.15; text-decoration: none; }
.cont .meta { color: var(--soft); font-size: 14px; }

.lib { padding-top: 26px; padding-bottom: 72px; }
.lib .hd { display: flex; align-items: baseline; gap: 14px; margin-bottom: 26px; flex-wrap: wrap; }
.lib h2 { font-size: 28px; margin: 0; }
.lib .hd input { width: 250px; height: 40px; margin-left: auto; align-self: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 44px 34px; }

.cover { position: relative; isolation: isolate; aspect-ratio: 360 / 466; display: block; border-radius: 1px; }
.cover .pg { position: absolute; inset: 0; background: var(--paper); box-shadow: var(--shadow-page); overflow: hidden; filter: var(--cover-dim);
  transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.cover .pg img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; mix-blend-mode: var(--page-blend); filter: var(--page-filter); }
.cover .bk { position: absolute; inset: 0; background: var(--paper); filter: var(--cover-back); box-shadow: 0 1px 2px rgba(40,30,20,.15); }
.cover .b1 { transform: translate(5px, -4px) rotate(1.3deg); z-index: -1; }
.cover .b2 { transform: translate(9px, -7px) rotate(2.4deg); z-index: -2; }
a.cover:hover .pg { transform: translateY(-3px); }
.cover .none { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--page-note);
  font-size: 14px; font-weight: 600; background: repeating-linear-gradient(transparent 0 14px, rgba(92,112,65,.10) 14px 15px), var(--paper); }
.cover .none.busy::before { content: ""; position: absolute; top: 18px; left: 50%; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%;
  border: 2.5px solid #5c7041; border-top-color: transparent; animation: spin 1s linear infinite; }
.sheet .t { display: block; font-size: 19px; line-height: 1.15; margin-top: 14px; text-decoration: none; }
.sheet .t:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.sheet .a { color: var(--soft); font-size: 14px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; line-height: 1; padding: 3px 6px 2px;
  border-radius: 4px; border: 1.5px solid var(--line-strong); color: var(--soft); }
.sheet .m { display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: center; color: var(--soft); font-size: 14px; }
.sheet .acts { display: flex; gap: 2px; margin: 6px 0 0 -10px; opacity: 0; transition: opacity .15s; }
.sheet:hover .acts, .sheet:focus-within .acts { opacity: 1; }
@media (hover: none) { .sheet .acts { opacity: 1; } }
.sheet .acts button, .sheet .acts .button { height: 34px; width: 34px; padding: 0; border: 0; background: none; color: var(--soft); }
.sheet .acts button:hover, .sheet .acts .button:hover { color: var(--ink); background: var(--act-soft); }
.sheet .confirm { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 14px; flex-wrap: wrap; }
.sheet .confirm button { height: 32px; font-size: 14px; padding: 0 12px; }
.sheet .confirm button.danger { background: var(--bad); border-color: var(--bad); color: var(--field); }
.status { font-weight: 700; font-size: 14px; }
.status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 7px; vertical-align: 1px; }
.status.check { color: var(--chk); } .status.bad { color: var(--bad); } .status.busy { color: var(--act-text); }

/* ---- the steps of making a sheet ---- */
.steps-bar { display: flex; align-items: center; gap: 22px; padding-top: 6px; padding-bottom: 20px; flex-wrap: wrap; }
.steps-bar ol { display: flex; align-items: center; list-style: none; margin: 0; padding: 0; flex: 1; max-width: 900px; min-width: 0; }
.steps-bar li { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; color: var(--soft); flex: 1; white-space: nowrap; }
.steps-bar li:last-child { flex: 0 0 auto; }
.steps-bar li::after { content: ""; flex: 1; height: 1.5px; background: var(--line-strong); margin: 0 14px; min-width: 12px; }
.steps-bar li:last-child::after { display: none; }
.steps-bar .num { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 14px; background: var(--field); flex: none; }
.steps-bar li.on { color: var(--ink); }
.steps-bar li.on .num { background: var(--act); border-color: var(--act); color: var(--act-ink); }
.steps-bar li.done .num { background: var(--act-soft); border-color: var(--act-soft); color: var(--act-text); }
@media (max-width: 760px) { .steps-bar li:not(.on) .lbl { display: none; } }

header.top .top-link { color: var(--soft); text-decoration: none; font-weight: 600; font-size: 15px; }
header.top .top-link:hover { color: var(--ink); }
/* settings */
.settings { max-width: 720px; padding-top: 30px; padding-bottom: 72px; }
.settings h1 { font-size: 34px; line-height: 1.1; margin: 18px 0 24px; }
.settings h2 { font-size: 17px; font-weight: 700; margin: 0 0 6px; font-family: inherit; }
.settings section { border-top: 1px solid var(--line); padding-top: 20px; }
.settings p { margin: 0 0 12px; line-height: 1.5; }
.settings .browser { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px 30px; }
.settings .browser select { font: inherit; font-weight: 600; font-size: 15px; height: 40px; padding: 0 12px; border-radius: 6px;
  border: 1.5px solid var(--line); background: var(--field); color: var(--ink); min-width: 200px; }
.settings .browser select:disabled { opacity: .5; }
.settings .saved { color: var(--soft); font-size: 14px; min-height: 20px; }
.settings ul { margin: 0 0 12px; padding-left: 20px; line-height: 1.5; color: var(--soft); }

/* details step */
.details { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); padding-top: 34px; padding-bottom: 72px; }
.details figure { margin: 0; }
.details figure img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; border-radius: 6px; background: var(--band);
  box-shadow: 0 1px 2px rgba(40,30,20,.12), 0 14px 26px -16px rgba(40,30,20,.5); }
.details figure .file { aspect-ratio: 16 / 9; border-radius: 6px; background: var(--band); display: grid; place-items: center; text-align: center; padding: 24px; }
.details figure .file svg.i { width: 36px; height: 36px; color: var(--soft); }
.details figcaption { color: var(--soft); font-size: 14.5px; margin-top: 12px; }
.details figcaption b { color: var(--ink); font-weight: 600; }
.details h1 { font-size: 34px; line-height: 1.1; margin: 0 0 4px; }
.details .lede { color: var(--soft); margin: 0 0 24px; }
.fld { margin-bottom: 18px; max-width: 540px; }
.fld > label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.fld > label .opt { font-weight: 400; color: var(--soft); }
.hint { color: var(--soft); font-size: 14px; margin-top: 6px; }
.more { border-top: 1px solid var(--line); margin-top: 26px; padding-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px 40px; max-width: 780px; }
.more h2 { font-size: 15px; font-weight: 700; margin: 0 0 2px; font-family: inherit; }
.times { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: var(--soft); }
.times input { width: 104px; font-variant-numeric: tabular-nums; }
label.choice { display: flex; gap: 12px; align-items: flex-start; padding: 7px 0; cursor: pointer; border-radius: 4px; }
label.choice input { appearance: none; margin: 3px 0 0; width: 18px; height: 18px; flex: none; border-radius: 50%; border: 1.5px solid var(--soft); background: var(--field); }
label.choice input:checked { border-color: var(--act); background: radial-gradient(var(--act) 0 4px, var(--field) 4.5px); }
label.choice input:focus { outline: none; box-shadow: none; }
label.choice b { font-weight: 600; } label.choice span span { color: var(--soft); }
.foot { display: flex; align-items: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
.foot button.primary { height: 52px; font-size: 16.5px; padding: 0 24px; }

/* progress */
.progress { max-width: 640px; margin: 34px auto 72px; }
.progress h1 { font-size: 30px; margin: 0; line-height: 1.15; }
ul.jobs { list-style: none; padding: 0; margin: 20px 0; }
ul.jobs li { display: flex; align-items: center; gap: 12px; padding: 7px 0; color: var(--soft); }
ul.jobs li.active { color: var(--ink); font-weight: 600; }
ul.jobs li.done { color: var(--ink); }
ul.jobs .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; flex: none; }
ul.jobs .dot svg.i { width: 13px; height: 13px; stroke-width: 2.4; }
ul.jobs li.done .dot { background: var(--act); border-color: var(--act); color: var(--act-ink); }
ul.jobs li.active .dot { border-color: var(--act); border-top-color: transparent; animation: spin 1s linear infinite; }
ul.jobs li.failed .dot, ul.jobs li.cancelled .dot { border-color: var(--bad); color: var(--bad); }
ul.jobs .detail { margin-left: auto; font-weight: 400; color: var(--soft); font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: -2px 0 4px 34px; }
.bar > div { height: 100%; background: var(--act); transition: width .4s; }
pre.log { white-space: pre-wrap; font-size: 12.5px; max-height: 320px; overflow: auto; background: var(--field); border: 1px solid var(--line); padding: 10px; border-radius: 6px; }
details > summary { cursor: pointer; color: var(--soft); font-size: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* sheet screen */
.sheet-head { display: flex; align-items: center; gap: 12px 16px; padding-top: 4px; padding-bottom: 18px; flex-wrap: wrap; }
.sheet-head h1 { font-size: 28px; margin: 0 0 0 8px; line-height: 1.15; }
.sheet-head .who { color: var(--soft); }
.sheet-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: clamp(28px, 4vw, 56px); align-items: start; padding-top: 22px; padding-bottom: 72px; }
.stage { max-width: 760px; width: 100%; justify-self: center; }
.page-tabs { display: flex; gap: 22px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.page-tabs button { height: 38px; padding: 0; border: 0; border-radius: 0; background: none; color: var(--soft); font-weight: 600;
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.page-tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--act); }
.spage { position: relative; background: var(--paper); box-shadow: var(--shadow-page); filter: var(--cover-dim); }
.spage img { width: 100%; height: 100%; display: block; mix-blend-mode: var(--page-blend); filter: var(--page-filter); }
.rings { position: absolute; inset: 0; pointer-events: none; }
.ring { position: absolute; border: 2.5px solid #5c7041; border-radius: 4px; background: rgba(92,112,65,.10); margin: -3px; box-sizing: content-box; padding: 1px; }
.side { display: flex; flex-direction: column; gap: 22px; position: sticky; top: 16px; }
.side h2 { font-size: 24px; margin: 0 0 4px; }
.side section + section { border-top: 1px solid var(--line); padding-top: 18px; }
.warning { padding: 12px 14px; margin: 0 -14px; border-radius: 6px; font-size: 15px; position: relative; }
.warning + .warning::before { content: ""; position: absolute; top: 0; left: 14px; right: 14px; border-top: 1px solid var(--line); }
.warning.on { background: var(--act-soft); }
.warning.on::before, .warning.on + .warning::before { display: none; }
.warning.problem { background: var(--bad-soft); margin: 0 0 10px; }
.warning.check > div:first-child { color: var(--ink); }
.warning.note { padding: 6px 14px; color: var(--soft); font-size: 14px; }
.warning .show { display: inline-block; margin-top: 6px; font-size: 14px; color: var(--act-text); text-decoration-color: currentColor; }
.warning details { margin-top: 4px; font-size: 13.5px; color: var(--soft); }
.side .acts { display: grid; gap: 10px; justify-items: start; }
.side .acts h2 { margin: 0; }
.side form { display: grid; gap: 10px; width: 100%; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 6px; padding: 3px; background: var(--field); }
.seg button { height: 34px; border: 0; border-radius: 4px; background: none; color: var(--soft); padding: 0 14px; }
.seg button[aria-checked=true] { background: var(--act); color: var(--act-ink); }
.theme-seg button { padding: 0 11px; gap: 6px; }
@media (max-width: 760px) { .theme-seg .lbl { display: none; } }

  border: 1.5px solid var(--line); background: var(--field); color: var(--ink); }

<body>
<div class="band"><header class="top">

    <path d="M12.6 9.6v9.8c0 .8.9 1.3 1.6.8l7.3-4.9c.6-.4.6-1.2 0-1.6l-7.3-4.9c-.7-.5-1.6 0-1.6.8z" fill="var(--mark-cut)"/></svg>Vid2Tab</a>
  <span class="spacer"></span>

<main id="app"></main>
<div id="toast" class="toast hidden" role="status"></div>

<script>
'use strict';
const $ = (sel, root = document) => root.querySelector(sel);
const app = $('#app');

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value == null || value === false) continue;
    if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
    else if (key === 'class') el.className = value;
    else if (key === 'html') el.innerHTML = value;
    else el.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}

// One drawn icon set (18 px, 1.6 stroke).
const ICONS = {
  back: 'M10 4L5 9l5 5M5 9h9', next: 'M8 4l5 5-5 5M13 9H4',
  download: 'M9 3v8m-3.5-3.5L9 11l3.5-3.5M3.5 14.5h11', print: 'M5 7V3h8v4M5 12.5H3.5V7h11v5.5H13M5 10h8v5H5z',
  play: 'M6 4.2v9.6c0 .6.7 1 1.2.6l7-4.8c.4-.3.4-.9 0-1.2l-7-4.8C6.7 3.2 6 3.6 6 4.2z', trash: 'M3 5h12M7.5 5V3.5h3V5M4.8 5l.7 10h7l.7-10M7.6 8v4.5M10.4 8v4.5',
  edit: 'M11.5 3.5l3 3L7 14H4v-3z', file: 'M5 2.5h5.5L14 6v9.5H5zM10.5 2.5V6H14M7.5 9.5l3 1.8-3 1.8z', close: 'M5 5l8 8M13 5l-8 8',
  prev: 'M11 3.5L5.5 9l5.5 5.5', full: 'M3 7V3h4M11 3h4v4M15 11v4h-4M7 15H3v-4', pages: 'M2.5 3.5h5.5v11H2.5zM10 3.5h5.5v11H10z',
  check: 'M4 9.5l3.2 3L14 5.5', sun: 'M9 5.5a3.5 3.5 0 110 7 3.5 3.5 0 010-7zM9 1.5v1.5M9 15v1.5M1.5 9H3M15 9h1.5M3.7 3.7l1 1M13.3 13.3l1 1M3.7 14.3l1-1M13.3 4.7l1-1',
  moon: 'M14.5 10.5A6 6 0 017.5 3.5a6 6 0 107 7z', half: 'M4.5 2h9v14h-9zM4.5 9h9M7 5.5h4M7 12.5h4', night: 'M14.5 10.5A6 6 0 017.5 3.5a6 6 0 107 7zM13.2 1.8v3M11.7 3.3h3', auto: 'M9 2.5a6.5 6.5 0 100 13zM9 2.5a6.5 6.5 0 010 13', search: 'M8 3a5 5 0 110 10A5 5 0 018 3zM11.7 11.7L15 15',
  pause: 'M6 4v10M12 4v10', video: 'M2.5 4.5h9.5v9H2.5zM12 8l3.5-2v6L12 10',

const icon = name => h('span', { 'aria-hidden': 'true', style: 'display:contents',
  html: `<svg class="i" viewBox="0 0 18 18"><path d="${ICONS[name]}"/></svg>` });

async function api(path, body) {
  const options = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                              body: JSON.stringify(body) };
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) { const error = new Error(data.error || response.statusText); error.field = data.field; throw error; }
  return data;
}

function toast(text) {
  const el = $('#toast');
  el.textContent = text; el.classList.remove('hidden');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.add('hidden'), 4000);
}

const store = {
  get(key) { try { return localStorage.getItem('vid2tab.' + key); } catch (e) { return null; } },
  set(key, value) { try { value == null ? localStorage.removeItem('vid2tab.' + key) : localStorage.setItem('vid2tab.' + key, value); } catch (e) {} },
};
const plural = (n, word, many = word + 's') => `${n} ${n === 1 ? word : many}`;
const day = seconds => new Date(seconds * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
const enc = encodeURIComponent;
const clock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

// ---- theme: Auto (the Mac's light or dark), Light, Dark (dimmed paper), Night (light notes on dark) ----
// One setting for the whole app; every switch on screen (header, play mode toolbar) shows and changes it.

const THEMES = [['auto', 'Auto', 'auto', 'As your Mac: light or dark'], ['light', 'Light', 'sun', 'Light'],
  ['dark', 'Dark', 'moon', 'Dark, with the paper dimmed'], ['night', 'Night', 'night', 'Night: light notes on a dark page']];
const theme = () => { const t = store.get('theme'); return THEMES.some(([v]) => v === t) ? t : 'auto'; };
function setTheme(value) {
  store.set('theme', value === 'auto' ? null : value);
  if (value === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = value;
  document.querySelectorAll('.theme-seg button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.theme === value)));

function themeSwitch() {
  return h('span', { class: 'seg theme-seg', role: 'radiogroup', 'aria-label': 'Colours' }, ...THEMES.map(([value, label, iconName, title]) =>
    h('button', { type: 'button', role: 'radio', 'data-theme': value, 'aria-checked': String(theme() === value), title, 'aria-label': label,
      onclick: () => setTheme(value) }, icon(iconName), h('span', { class: 'lbl' }, label))));

$('#theme-slot').replaceWith(themeSwitch());
setTheme(theme());
addEventListener('storage', e => { if (e.key === 'vid2tab.theme') setTheme(theme()); });   // changed in another tab

// ---- screens ----------------------------------------------------------------------------------

const screens = {};
let leave = null;      // cleanup of the current screen (timers, listeners)

async function route() {
  if (leave) { leave(); leave = null; }
  document.title = 'Vid2Tab';
  const [, screen = '', ...args] = location.hash.split('/');
  app.replaceChildren();
  try {
    await (screens[screen] || screens[''])(...args.map(decodeURIComponent));
  } catch (error) {
    app.replaceChildren(h('div', { class: 'wrap empty' }, h('h2', { class: 'serif' }, 'This page could not be shown'),
      h('p', {}, error.message), h('a', { class: 'button', href: '#/' }, icon('back'), 'Your sheets')));
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

function openLink(sheet) {
  if (sheet.source === 'pdf') return '#/play/' + enc(sheet.name);         // an opened PDF: nothing to check
  return (sheet.state === 'done' || sheet.state === 'failed' ? '#/sheet/' : '#/make/') + enc(sheet.name);
}

// Open a PDF: sheet music that is already a PDF joins Your sheets (tagged PDF) and opens in play mode.
function pickPdf() {
  const picker = h('input', { type: 'file', accept: 'application/pdf,.pdf', class: 'hidden' });
  picker.addEventListener('change', () => { if (picker.files[0]) openPdf(picker.files[0]); picker.remove(); });

async function openPdf(file) {

function statusLine(sheet) {

    drawRings();
  };
  const drawRings = () => {
    const info = layout.pages[current];
    rings.replaceChildren();
    if (!info) return;
    // one ring per line: from the first to the last named measure on it
    const byLine = new Map();
    for (const n of ringed) {
      const at = where[n];
      if (!at || at.page !== current) continue;
      const key = at.box.join(), r = byLine.get(key);
      byLine.set(key, r ? { box: at.box, x0: Math.min(r.x0, at.x0), x1: Math.max(r.x1, at.x1) } : { ...at });
    }
    for (const r of byLine.values()) {
      const [L, T, R, B] = r.box, w = R - L;
      const el = h('span', { class: 'ring' });
      Object.assign(el.style, { left: `${(L + w * r.x0) / info.width * 100}%`, width: `${w * (r.x1 - r.x0) / info.width * 100}%`,
        top: `${T / info.height * 100}%`, height: `${(B - T) / info.height * 100}%` });
      rings.append(el);
    }
    rings.firstChild?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  };
  for (let p = 0; p < pages; p++) tabs.append(h('button', { type: 'button', role: 'tab', onclick: () => { ringed = []; select(null); showPage(p); } }, `Page ${p + 1}`));
  // ← / → turn pages as soon as the screen opens, wherever the focus is, except while typing
  const keys = e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft' || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || pages < 2) return;
    const t = e.target;
    if (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    ringed = []; select(null);
    showPage(current + (e.key === 'ArrowRight' ? 1 : -1), tabs.contains(t));
    e.preventDefault();
  };
  document.addEventListener('keydown', keys);
  leave = () => document.removeEventListener('keydown', keys);
  if (pages < 2) tabs.classList.add('hidden');

  // a warning that names measures: click shows them on their page
  let selected = null;
  const select = el => { selected?.classList.remove('on'); selected = el; el?.classList.add('on'); };
  const pointTo = (w, el) => {
    const found = (w.measures || []).filter(n => where[n]);
    if (!found.length) return null;
    const page = where[found[0]].page, last = where[found[found.length - 1]].page;
    const label = (found.length === 1 ? `Measure ${found[0]}` : `Measures ${found[0]}–${found[found.length - 1]}`)
      + (last > page ? ` · pages ${page + 1}–${last + 1}` : ` · page ${page + 1}`);
    return h('button', { type: 'button', class: 'link show', onclick: () => {
      if (selected === el) { select(null); ringed = []; drawRings(); return; }
      select(el); ringed = found; showPage(page);
    } }, label);
  };

  const side = h('aside', { class: 'side' });
  const preview = sheet.pdf && pages ? stage : h('div', { class: 'panel empty' }, 'No PDF yet.');
  app.append(h('div', { class: 'band' }, head), h('div', { class: 'wrap sheet-layout' }, preview, side));
  if (sheet.pdf && pages) showPage(0);

  const editInfo = () => {
    const title = h('input', { type: 'text', value: sheet.title, 'aria-label': 'Title' });
    const artist = h('input', { type: 'text', value: sheet.artist, placeholder: 'Artist (optional)', 'aria-label': 'Artist' });
    const error = h('div', { class: 'error hidden' });
    const save = h('button', { class: 'primary', type: 'submit' }, 'Save and make again');
    const form = h('form', {}, h('h2', { class: 'serif' }, 'Title and artist'), title, artist, error,
      h('div', { class: 'hint' }, 'The sheet is made again with the new heading (the video and the music area are kept).'),
      h('div', { class: 'row' }, h('button', { type: 'button', onclick: () => form.replaceWith(warnings) }, 'Cancel'), h('span', { class: 'spacer' }), save));
    form.addEventListener('submit', async e => {
      e.preventDefault(); save.disabled = true;
      try { await api(`/api/sheets/${enc(sheet.name)}/remake`, { title: title.value, artist: artist.value }); location.hash = '#/make/' + enc(sheet.name); }
      catch (err) { error.textContent = err.message; error.classList.remove('hidden'); save.disabled = false; }
    });
    warnings.replaceWith(form); title.focus(); title.select();
  };
  const warnings = warningList(sheet, pointTo);
  side.append(warnings, sheetActions(sheet));
  const text = h('pre', { class: 'log' }, 'Loading…');
  const report = h('details', {}, h('summary', {}, 'Full report'), text);
  report.addEventListener('toggle', async () => {
    if (report.open) {
      const response = await fetch(`/files/${enc(name)}/report.md`);
      text.textContent = response.ok ? await response.text() : 'No report yet.';
    }
  });
  side.append(report);
};

function printPdf(src) {
  // the browser's own PDF viewer prints it as it is (the page images on screen are only a preview)
  const frame = h('iframe', { src, class: 'hidden', title: 'Print' });
  frame.addEventListener('load', () => {
    try { frame.contentWindow.focus(); frame.contentWindow.print(); }
    catch (e) { window.open(src, '_blank'); }
    setTimeout(() => frame.remove(), 60000);
  });
  document.body.append(frame);
}

function sheetActions(sheet) {
  const box = h('section', { class: 'acts' });
  const range = sheet.range ? `${clock(Math.round(sheet.range.start))} to ${sheet.range.end != null ? clock(Math.round(sheet.range.end)) : 'the end'}` : 'the whole video';
  const written = sheet.layout === 'as written';
  const error = h('div', { class: 'error hidden' });
  const option = (value, label) => h('button', { type: 'button', role: 'radio', 'aria-checked': String((value === 'as written') === written),
    onclick: () => (value === 'as written') !== written && switchLayout(value) }, label);
  const show = () => box.replaceChildren(
    h('h2', { class: 'serif' }, 'Repeats'),
    h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Repeats' }, option('as played', 'As played'), option('as written', 'As written')),
    h('div', { class: 'hint', style: 'margin-top:0' }, written ? 'A page the video shows again is printed once.' : 'Every page the video shows, in order.',
      ' Changing it makes the sheet again.'),
    error,
    h('h2', { class: 'serif', style: 'margin-top:14px' }, 'Not quite right?'),
    h('a', { class: 'link', href: '#/crop/' + enc(sheet.name) }, 'Move the music area or cover a logo'),
    h('button', { type: 'button', class: 'link', onclick: editRange }, 'Use a different part of the video'),
    h('div', { class: 'hint' }, 'Made from ' + range + '.'));
  const switchLayout = async value => {
    try { await api(`/api/sheets/${enc(sheet.name)}/remake`, { layout: value }); location.hash = '#/make/' + enc(sheet.name); }
    catch (err) { error.textContent = err.message; error.classList.remove('hidden'); }
  };
  const editRange = () => {
    const toText = s => s == null ? '' : clock(Math.round(s));
    const start = h('input', { type: 'text', value: sheet.range ? toText(sheet.range.start) : '', placeholder: '0:00', 'aria-label': 'Start time' });
    const end = h('input', { type: 'text', value: sheet.range ? toText(sheet.range.end) : '', placeholder: 'end', 'aria-label': 'End time' });
    const rangeError = h('div', { class: 'error hidden' });
    const go = h('button', { class: 'primary', type: 'submit' }, 'Make it again');
    const form = h('form', {}, h('h2', { class: 'serif' }, 'Start & end time'),
      h('div', { class: 'times' }, start, 'to', end),
      h('div', { class: 'hint' }, 'Leave both empty for the whole video. That part of the video is fetched again; you then check the music area.'),
      rangeError, h('div', { class: 'row' }, h('button', { type: 'button', onclick: show }, 'Cancel'), h('span', { class: 'spacer' }), go));
    form.addEventListener('submit', async e => {
      e.preventDefault(); go.disabled = true;
      try { await api(`/api/sheets/${enc(sheet.name)}/remake`, { start: start.value.trim(), end: end.value.trim() }); location.hash = '#/make/' + enc(sheet.name); }
      catch (err) { rangeError.textContent = err.message; rangeError.classList.remove('hidden'); go.disabled = false; }
    });
    box.replaceChildren(form); start.focus();
  };
  show();
  return box;
}

function warningList(sheet, pointTo = () => null) {
  const box = h('section', {});
  const problems = sheet.warnings.filter(w => w.level === 'problem');
  const checks = sheet.warnings.filter(w => w.level === 'check');
  const notes = sheet.warnings.filter(w => w.level === 'note');
  if (sheet.state === 'failed' || problems.length)
    box.append(h('div', { class: 'warning problem' }, h('strong', {}, 'The sheet could not be made.'),
      ...(problems.length ? problems : [{ text: 'No measures were found. The music area may be wrong.' }]).map(w =>
        h('div', { style: 'margin-top:4px' }, w.text, w.detail && h('details', {}, h('summary', {}, 'details'), w.detail))),
      h('a', { class: 'button', style: 'margin-top:10px', href: '#/crop/' + enc(sheet.name) }, 'Adjust the music area')));
  if (checks.length || !problems.length) {
    box.append(h('h2', { class: 'serif' }, checks.length ? plural(checks.length, 'thing') + ' to check' : 'Nothing to check'));
    box.append(h('div', { class: 'muted', style: 'margin-bottom:8px' },
      checks.length ? 'Everything else matched the video.' : notes.length ? 'Only small notes, below.' : 'Everything matched the video.'));
  }
  box.append(...grouped(checks, pointTo));
  if (notes.length) box.append(h('details', { style: 'margin-top:8px' }, h('summary', {}, plural(notes.length, 'small note')), ...grouped(notes, pointTo)));
  return box;
}

function grouped(list, pointTo) {
  // Alike warnings (same rule) after the first two fold into "N more like this".
  const seen = new Map(), out = [];
  for (const w of list) {
    const key = w.kind ?? w.text, group = seen.get(key);
    if (!group) { const g = { items: [w] }; seen.set(key, g); out.push(g); } else group.items.push(w);
  }
  const item = w => warningItem(w, pointTo);
  return out.flatMap(g => g.items.length <= 3 ? g.items.map(item)
    : [...g.items.slice(0, 2).map(item), h('details', { style: 'margin:0 0 10px' },
        h('summary', {}, `${g.items.length - 2} more like this`), ...g.items.slice(2).map(item))]);
}

function warningItem(w, pointTo = () => null) {
  const el = h('div', { class: 'warning ' + w.level }, h('div', {}, w.text));
  const show = pointTo(w, el);
  if (show) el.append(show);
  if (w.detail && w.detail !== w.text) el.append(h('details', {}, h('summary', {}, 'details'), w.detail));
  return el;
}

// ---- play mode --------------------------------------------------------------------------------
// A reading view for playing from: pages fitted to the screen height, one or two side by side, turned
// by keys (Bluetooth page-turner pedals send Space, arrows or PageUp/PageDown), by clicking the left or
// right edge, or from the toolbar, which fades while the mouse is still. Remembers the page per sheet.

// ---- play along: the video ------------------------------------------------------------------------
// Two players behind one face: { play, pause, playing, time, seek, rate, setRate, rates, duration, destroy }.
// Times are seconds of the part of the video the sheet was made from (timing's clock); YouTube plays the
// whole video, so its times are shifted by the range start. YouTube terms: nothing is laid over the player,
// its own controls stay, it is never smaller than 200 x 200 px and never starts by itself (docs/play-mode.md).

let youtubeApi = null;
function loadYoutubeApi() {
  if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if (!youtubeApi) youtubeApi = new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('offline')), 10000);
    const before = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { clearTimeout(timer); before?.(); resolve(window.YT); };
    const script = h('script', { src: 'https://www.youtube.com/iframe_api', async: true });
    script.onerror = () => { clearTimeout(timer); reject(new Error('offline')); };
    document.head.append(script);
  }).catch(error => { youtubeApi = null; throw error; });    // try again next time (the network may be back)
  return youtubeApi;
}

// A smooth clock over a player whose time only updates now and then: between updates the time runs on at
// the playback rate from the last reported value.
function smoothClock(read, rate, playing) {
  let last = null, at = 0;
  return () => {
    const now = performance.now(), value = read();
    if (last === null || value !== last.value || !playing()) { last = { value }; at = now; return value; }
    return value + (now - at) / 1000 * rate();
  };
}

function youtubePlayer(box, videoId, range, on) {
  const start = range.start || 0, end = range.end;
  const holder = h('div');
  box.replaceChildren(holder);
  let player = null, ready = false, closed = false, want = null;   // want: what the user last asked for
  const state = () => ready ? player.getPlayerState() : -1;
  const face = {
    kind: 'youtube',
    play: () => { want = 'play'; if (ready) player.playVideo(); },
    pause: () => { want = 'pause'; if (ready) player.pauseVideo(); },
    // playing, or buffering on the way to playing (a pause asked for while buffering wins); before the player is
    // ready, a play asked for (K, the button) is queued and counts as playing, so a second K cancels it
    playing: () => !ready ? want === 'play' : state() === 1 ? want !== 'pause' : state() === 3 && want === 'play',
    time: () => 0, seek: t => ready && player.seekTo(start + Math.max(0, Math.min(t, face.duration())), true),
    rate: () => ready ? player.getPlaybackRate() : 1, setRate: r => ready && player.setPlaybackRate(r),
    rates: () => ready ? player.getAvailablePlaybackRates() : [1],
    duration: () => ready ? Math.max(0, (end || player.getDuration() || 0) - start) : 0,
    iframe: () => ready && player.getIframe(),
    destroy: () => { closed = true; try { player?.destroy(); } catch (e) {} },
  };
  const raw = () => ready ? player.getCurrentTime() - start : 0;
  face.time = smoothClock(raw, face.rate, face.playing);
  loadYoutubeApi().then(YT => {
    if (closed) return;
    player = new YT.Player(holder, {
      host: 'https://www.youtube-nocookie.com', videoId,
      playerVars: { controls: 1, disablekb: 1, rel: 0, playsinline: 1, origin: location.origin,
                    start: Math.floor(start), ...(end ? { end: Math.ceil(end) } : {}) },
      events: {
        onReady: () => { ready = true; on.ready(face); if (want === 'play') player.playVideo(); },   // queued
        onStateChange: e => {
          if (e.data === 1 && want === 'pause') player.pauseVideo();        // a pause asked for while it was buffering
          if (e.data === 1 && want === null) want = 'play';                  // started from YouTube's own controls
          if (e.data === 2 || e.data === 0) want = want === 'play' && e.data === 2 ? 'pause' : want;   // paused there
          on.change();
        },
        onPlaybackRateChange: () => on.change(),
        // 2 bad id, 5 HTML5 error, 100 removed or private, 101 / 150 / 153 the owner does not allow embedding
        onError: e => { if (!closed) on.fail(e.data === 101 || e.data === 150 || e.data === 153 ? 'embed' : 'error'); },
      } });
  }).catch(() => { if (!closed) on.fail('offline'); });
  return face;
}

function filePlayer(box, url, on) {
  const video = h('video', { src: url, preload: 'auto', playsinline: true, tabindex: -1 });
  video.preservesPitch = true;
  box.replaceChildren(video);
  const face = {
    kind: 'file',
    play: () => video.play().catch(() => {}), pause: () => video.pause(),
    playing: () => !video.paused && !video.ended,
    time: () => video.currentTime, seek: t => { video.currentTime = Math.max(0, Math.min(t, face.duration() || t)); },
    rate: () => video.playbackRate, setRate: r => { video.playbackRate = r; on.change(); },
    rates: () => [0.25, 0.5, 0.6, 0.75, 0.9, 1, 1.25, 1.5, 2],          // any rate works; these are offered
    duration: () => Number.isFinite(video.duration) ? video.duration : 0,
    destroy: () => { video.pause(); video.removeAttribute('src'); video.load(); },
  };
  video.addEventListener('click', () => face.playing() ? face.pause() : face.play());     // our own element
  for (const type of ['play', 'pause', 'ended', 'ratechange', 'durationchange']) video.addEventListener(type, () => on.change());
  video.addEventListener('loadedmetadata', () => on.ready(face), { once: true });
  video.addEventListener('error', () => on.fail('file'), { once: true });
  return face;
}

const playSettings = {
  get spread() { return store.get('play.spread') || 'auto'; },          // 'auto' | '1' | '2'
  get byTwo() { return store.get('play.bytwo') === '1'; },              // two-page view turns two at a time
  get half() { return store.get('play.half') === '1'; },                // half turns (off by default)
};

screens.play = async function playScreen(name) {
  const sheet = await api('/api/sheets/' + enc(name));
  if (!sheet.pdf) { location.hash = '#/sheet/' + enc(name); return; }
  document.title = sheet.title + ' · Vid2Tab';
  store.set('last', name);
  const layout = (sheet.page_layout || {}).pages || [];
  const count = layout.length || sheet.pages || 1;
  const size = p => layout[p] || layout[0] || { width: 612, height: 792 };
  const back = sheet.source === 'pdf' ? '#/' : '#/sheet/' + enc(name);
  let first = Math.max(0, Math.min(count - 1, +store.get('page.' + name) || 0));
  let halfway = false;     // a half turn is showing: the next page's top lines over the top of this page

  document.body.classList.add('playing');
  const stage = h('div', { class: 'play-stage' });
  const left = h('button', { type: 'button', class: 'edge l', tabindex: -1, 'aria-label': 'Previous page' }, icon('prev'));
  const right = h('button', { type: 'button', class: 'edge r', tabindex: -1, 'aria-label': 'Next page' }, icon('next'));
  const counter = h('span', { class: 'count', 'aria-live': 'polite' });
  const corner = h('div', { class: 'play-corner', 'aria-hidden': 'true' });
  const toggle = (label, iconName, key, title) => {
    const b = h('button', { type: 'button', class: 'quiet', title, 'aria-pressed': String(store.get(key) === '1') }, icon(iconName), label);
    b.addEventListener('click', () => { store.set(key, store.get(key) === '1' ? null : '1'); b.setAttribute('aria-pressed', String(store.get(key) === '1')); draw(); });
    return b;
  };
  const spreadSeg = h('span', { class: 'seg', role: 'radiogroup', 'aria-label': 'Pages shown' });
  const drawSeg = () => spreadSeg.replaceChildren(...[['1', '1 page'], ['2', '2 pages']].map(([v, label]) =>
    h('button', { type: 'button', role: 'radio', 'aria-checked': String(twoUp() === (v === '2')),
      title: 'Auto: two pages when the window is wide enough. Click to choose; click again for auto.',
      onclick: () => { store.set('play.spread', playSettings.spread === v ? null : v); draw(); } }, label)));
  const byTwo = toggle('Turn two at a time', 'pages', 'play.bytwo', 'In the two-page view, turn two pages at a time instead of one');
  const halfTurns = toggle('Half turns', 'half', 'play.half',
    "First press: the next page's top lines replace the top of this page (already played); second press: the rest");
  const full = h('button', { type: 'button', class: 'quiet', title: 'Full screen (F)', onclick: () => fullScreen() }, icon('full'), 'Full screen');
  const canAlong = sheet.source !== 'pdf';
  const alongButton = canAlong && h('button', { type: 'button', class: 'quiet', 'aria-pressed': 'false',
    title: 'Play along: the video beside the sheet (K plays and pauses)', onclick: () => setAlong(!along) }, icon('video'), 'Play along');
  const bar = h('div', { class: 'play-bar band' },
    h('a', { class: 'button quiet', href: back }, icon('back'), sheet.source === 'pdf' ? 'Your sheets' : 'Sheet'),
    h('span', { class: 'serif t' }, sheet.title), sheet.artist && h('span', { class: 'who' }, sheet.artist),
    h('span', { class: 'spacer' }),
    h('button', { type: 'button', class: 'quiet icon', 'aria-label': 'Previous page', onclick: () => turn(-1, true) }, icon('prev')), counter,
    h('button', { type: 'button', class: 'quiet icon', 'aria-label': 'Next page', onclick: () => turn(1, true) }, icon('next')),
    h('span', { class: 'vr' }), spreadSeg, byTwo, halfTurns, alongButton, h('span', { class: 'vr' }), themeSwitch(), full,
    h('button', { type: 'button', class: 'quiet open-pdf', title: 'Open a PDF', 'aria-label': 'Open a PDF', onclick: pickPdf }, icon('file'), h('span', { class: 'lbl' }, 'Open a PDF')));
  const sheetArea = h('div', { class: 'play-sheet' }, stage, left, right, corner);
  const videoPanel = h('aside', { class: 'play-video hidden', 'aria-label': 'Video' });
  const transport = h('div', { class: 'play-transport', role: 'group', 'aria-label': 'Video controls' });
  const divider = h('div', { class: 'divider hidden', role: 'separator', 'aria-label': 'Resize the video', title: 'Drag to resize the video' });
  const main = h('div', { class: 'play-main' }, sheetArea, divider, videoPanel);
  const view = h('div', { class: 'play bar-on', tabindex: -1 }, bar, main);
  app.append(view);
  const PAD = 12, GAP = 16;
  const fs = () => !!document.fullscreenElement;

  // which pages: one, or two side by side when two fit at full height (or as chosen)
  function twoUp() {
    if (count < 2) return false;
    if (playSettings.spread !== 'auto') return playSettings.spread === '2';
    const { width, height } = size(0);
    return sheetArea.clientWidth >= 2 * (sheetArea.clientHeight - 2 * PAD) * width / height + 40;
  }
  // with half turns on, the two-page view turns one page at a time (each press shows a new half of the music)
  const byTwoOn = () => playSettings.byTwo && !playSettings.half;
  const step = () => twoUp() && byTwoOn() ? 2 : 1;
  const lastFirst = () => twoUp() ? (byTwoOn() ? count - 1 - ((count - 1) % 2) : count - 2) : count - 1;
  // A half turn of page p: split p at its gap between lines nearest the middle (b), and show page p + 1 above
  // it down to its last gap above b (a), so no line of either page is cut. Gaps come from the server
  // (between the lines of a Vid2Tab sheet, between systems on other PDFs); none: a plain turn.
  function split(p) {
    if (p + 1 >= count) return null;
    const own = ((layout[p] || {}).gaps || []).slice(0, -1).filter(g => g > 0.15 && g < 0.85);   // not below the music
    const next = (layout[p + 1] || {}).gaps || [];
    const options = own.map(b => ({ b, a: Math.max(-1, ...next.filter(g => g <= b)) })).filter(o => o.a > 0);
    return options.sort((x, y) => Math.abs(x.b - 0.5) - Math.abs(y.b - 0.5))[0] || null;
  }
  const pageImage = p => {
    const { width, height } = size(p);
    const px = Math.ceil((innerHeight - 2 * PAD) * width / height * (devicePixelRatio || 1) / 200) * 200;
    return `/files/${enc(name)}/page/${p + 1}.png?w=${Math.min(2400, Math.max(400, px))}&v=${sheet.updated}`;
  };
  function draw() {
    first = Math.max(0, Math.min(first, lastFirst()));
    if (!playSettings.half || twoUp() || !split(first)) halfway = false;
    const shown = twoUp() ? [first, first + 1].filter(p => p < count) : [first];
    const img = (p, style) => h('img', { src: pageImage(p), alt: `${sheet.title}, page ${p + 1} of ${count}`, decoding: 'async', style,
                                          draggable: 'false' });      // a drag on the page chooses a loop
    stage.replaceChildren(...shown.map(p => {
      const { width, height } = size(p);
      let paper;
      if (halfway) {
        const { a, b } = split(p);
        paper = h('div', { class: 'play-page halfway' },
          img(p + 1, `clip-path: inset(0 0 ${(100 - a * 100).toFixed(2)}% 0)`),
          img(p, `clip-path: inset(${(b * 100).toFixed(2)}% 0 0 0)`),
          h('div', { class: 'half-line', style: `top: ${(b * 100).toFixed(2)}%`, 'aria-hidden': 'true' }));
      } else paper = h('div', { class: 'play-page' }, img(p));
      paper.dataset.ratio = width / height;
      paper.dataset.page = p;
      if (halfway) { const { a, b } = split(p); paper.dataset.a = a; paper.dataset.b = b; }
      return paper;
    }));
    fit();

      if (timing.how === 'cursor') {
        const mx0 = x0 + (x1 - x0) * place.x0, mx1 = x0 + (x1 - x0) * place.x1;
        paper.append(h('div', { class: 'follow-ring', style: `left:${pct(mx0 / W)};top:${box.top};width:${pct((mx1 - mx0) / W)};height:${box.height}` }));
        paper.append(h('div', { class: 'follow-head', style: `top:${box.top};height:${box.height}` }));
      }
    }
    moveHead();
  }
  function moveHead() {
    if (!lit || timing.how !== 'cursor') return;
    const place = places.get(lit.n), [x0, , x1] = place.box, W = (layout[place.page] || {}).width;
    const x = x0 + (x1 - x0) * (place.x0 + (place.x1 - place.x0) * lit.frac);
    for (const head of stage.querySelectorAll('.follow-head')) head.style.left = pct(x / W);
  }
  // which view the music wants. One page: the page of the music TURN_LEAD seconds ahead, so the page turns as the
  // page's last measure ends (and a D.C. or repeat that goes back turns back, not on), never hiding measures still
  // being played. Two pages (the music's page stays in view): the next page comes in once the music is halfway
  // through the page's last line. Half turns: the next page's top shows once the music enters the bottom part, and
  // the turn completes on the next page.
  const TURN_LEAD = 0.3;
  function wanted(place, ahead, frac) {
    const progress = (place.k + frac) / place.count;
    const onLast = place.line === place.lines - 1 && progress >= 0.5 && place.page + 1 < count;
    if (twoUp()) {
      const target = onLast ? place.page + 1 : place.page;
      if (target === first || target === first + 1) return { first, halfway: false };
      return { first: byTwoOn() ? target - (target % 2) : Math.max(0, target - 1), halfway: false };
    }
    if (playSettings.half) {
      const sp = split(place.page), H = (layout[place.page] || {}).height || 1;
      return { first: place.page, halfway: !!sp && place.box[1] / H >= sp.b - 0.002 };
    }
    return { first: ahead ? places.get(ahead.n).page : place.page, halfway: false };
  }
  let lastT = 0;
  function follow() {
    if (!canFollow || !player) return;
    let t = player.time();
    // a loop: reaching its end (having played into it) goes back exactly to its first measure (no lead-in:
    // the repeats are seamless), after the chosen pause if any
    if (loop && player.playing() && t >= loop.t1 && lastT < loop.t1 + 0.5 && lastT >= loop.t0 - LEAD_IN - 0.5) {
      goRound(); t = player.time();
    }
    if (Math.abs(t - lastT) > 3) released();          // a jump (YouTube's own seek bar too): back to the music
    lastT = t;
    if (aim && (t >= aim.t || t < aim.t - LEAD_IN - 1)) aim = null;
    const now = playedAt(t);
    const changed = (now && now.n) !== (lit && lit.n);
    lit = now;
    if (changed) paintFollow(); else moveHead();
    if (!lit || !following) return;
    const place = places.get(lit.n);
    // in a lead-in (a click on a measure, a loop going round) the view stays on the measure aimed at
    const want = aim ? wanted(places.get(aim.n), { n: aim.n }, 0) : wanted(place, playedAt(t + TURN_LEAD), lit.frac), same = want.first === first && want.halfway === halfway;
    if (held) {                // turned by hand: wait until the music reaches what is shown (or Follow is pressed)
      if (same) { held = false; drawFollowButton(); }
      return;
    }
    if (!same) { first = want.first; halfway = want.halfway; draw(); }
  }
  function released() { if (held) { held = false; drawFollowButton(); } }      // a seek: follow the music again
  function holdFollow() { if (along && canFollow && following && lit && !held) { held = true; drawFollowButton(); } }
  function toggleFollow() {
    if (held || !following) { following = true; held = false; } else following = false;
    store.set('play.follow', following ? null : 'off');
    drawFollowButton(); paintFollow();
  }
  function drawFollowButton() {
    const on = following && !held;
    followButton.setAttribute('aria-pressed', String(on));
    followButton.textContent = held ? 'Follow: back to the music' : 'Follow';
    followButton.title = held ? 'You turned the page: following waits until the music reaches it. Click to go back to the music now.'
      : on ? 'Following: the line being played is tinted and pages turn by themselves. Click to stop turning pages.'
      : 'Not following: click to tint the line being played and turn pages by themselves.';
  }

  // ---- click a measure: the video goes there; drag across measures: loop them ----
  // A click jumps to LEAD_IN s before the measure's start (the time of its pass closest to now: a repeat or a
  // D.C. plays it more than once) and keeps playing or paused. A drag from one measure to another loops the
  // whole measures between (from the first one's start to the last one's end: barline to barline); the loop is
  // shaded on the pages and the scrub bar, goes round with the same lead-in, and is kept per sheet until its
  // chip's x removes it. Works where the pages are matched to measures and the timing is known (Follow's data).
  const LEAD_IN = 1;
  let loop = null, aim = null;
  function spansOf(n) { return spans.filter(x => x.n === n); }
  function nearest(n, t) { return spansOf(n).sort((x, y) => Math.abs(x.a - t) - Math.abs(y.a - t))[0] || null; }
  function jumpTo(t, n) {
    if (!player) return;
    player.seek(Math.max(0, t - LEAD_IN));
    aim = { t, n };
    lastT = player.time();
    released(); drawTime(); follow();
  }
  // the measure under a point of a page on the stage, or null
  function measureAt(paper, x, y) {
    const r = paper.getBoundingClientRect(), fx = (x - r.left) / r.width, fy = (y - r.top) / r.height;
    let page = +paper.dataset.page;
    if (paper.dataset.a != null) {                    // a half turn: the next page's top above a, this page below b
      if (fy <= +paper.dataset.a) page += 1; else if (fy < +paper.dataset.b) return null;
    }
    const pg = layout[page];
    if (!pg || !pg.lines) return null;
    const X = fx * pg.width, Y = fy * pg.height;
    let best = null, gap = Infinity;
    for (const line of pg.lines) {
      const [x0, y0, x1, y1] = line.box, d = Y < y0 ? y0 - Y : Y > y1 ? Y - y1 : 0;
      if (d < gap && X >= x0 - 20 && X <= x1 + 20) { gap = d; best = line; }
    }
    if (!best || gap > 30 || !best.measures.length) return null;
    const [x0, , x1] = best.box, u = (X - x0) / (x1 - x0);
    const m = best.measures.find(m => u < m.x1) || best.measures[best.measures.length - 1];
    return places.has(m.n) && spansOf(m.n).length ? m.n : null;
  }
  // the loop's times for measures a..b (either order): the first one's pass nearest now, the last one's first
  // pass ending after it starts
  function loopOf(a, b) {
    const lo = Math.min(a, b), hi = Math.max(a, b), now = player ? player.time() : 0;
    const from = nearest(lo, now);
    const to = from && spansOf(hi).find(x => x.b > from.a);
    return from && to ? { a: lo, b: hi, t0: from.a, t1: to.b } : null;
  }
  let pauseTimer = 0;
  const loopPause = () => +(store.get('play.looppause') || 0);          // seconds between repeats: 0, 1 or 2
  function goRound() {
    player.seek(loop.t0);
    aim = { t: loop.t0, n: loop.a };
    lastT = player.time();
    const wait = loopPause();
    if (wait) {
      player.pause();
      clearTimeout(pauseTimer);
      pauseTimer = setTimeout(() => { pauseTimer = 0; if (loop && player && !player.playing()) player.play(); }, wait * 1000);
    }
  }
  function setLoop(value) {
    clearTimeout(pauseTimer); pauseTimer = 0;
    loop = value;
    store.set('loop.' + name, loop ? JSON.stringify(loop) : null);
    paintLoop(); drawLoop();
  }
  function paintLoop(choosing) {
    for (const el of stage.querySelectorAll('.loop-mark')) el.remove();
    const show = choosing || loop;
    if (!along || !canFollow || !show) return;
    const lo = Math.min(show.a, show.b), hi = Math.max(show.a, show.b);
    for (const paper of stage.children) {
      const p = +paper.dataset.page, a = paper.dataset.a != null ? +paper.dataset.a : null, b = a != null ? +paper.dataset.b : null;
      layout.forEach((pg, page) => (pg.lines || []).forEach(line => {
        const inside = line.measures.filter(m => m.n >= lo && m.n <= hi);
        if (!inside.length) return;
        const [x0, y0, x1, y1] = line.box, W = pg.width, H = pg.height;
        if (a == null ? page !== p : !((page === p && y0 / H >= b - 0.002) || (page === p + 1 && y1 / H <= a + 0.002))) return;
        const mx0 = x0 + (x1 - x0) * inside[0].x0, mx1 = x0 + (x1 - x0) * inside[inside.length - 1].x1;
        const cls = ['loop-mark', choosing ? 'choosing' : '', inside[0].n === lo ? 'from' : '', inside[inside.length - 1].n === hi ? 'to' : ''];
        paper.append(h('div', { class: cls.filter(Boolean).join(' '),
          style: `left:${pct(mx0 / W)};top:${pct(y0 / H)};width:${pct((mx1 - mx0) / W)};height:${pct((y1 - y0) / H)}` }));
      }));
    }
  }
  // the measures as printed on the sheet when both ends' numbers were read, else how many and when
  function loopLabel(l) {
    const pa = places.get(l.a).printed, pb = places.get(l.b).printed, many = l.b - l.a + 1;
    if (pa && pb && pb - pa === l.b - l.a) return pa === pb ? `Loop: measure ${pa}` : `Loop: measures ${pa}–${pb}`;
    return `Loop: ${many} measure${many > 1 ? 's' : ''}, ${fmt(l.t0)}–${fmt(l.t1)}`;
  }
  function drawLoop() {
    const band = $('.loopband', scrub), d = player ? player.duration() : 0;
    band.classList.toggle('hidden', !loop || !d);
    if (loop && d) { band.style.left = pct(loop.t0 / d); band.style.width = pct((loop.t1 - loop.t0) / d); }
    if (!canFollow) { loopRow.replaceChildren(); return; }
    loopRow.className = loop ? 'loop-chip' : 'loop-hint';
    loopRow.replaceChildren(...(loop ? [
      h('button', { type: 'button', title: 'Go to the start of the loop', onclick: () => { jumpTo(loop.t0, loop.a); refocus(); } },
        loopLabel(loop)),
      h('button', { type: 'button', class: 'x', 'aria-label': 'Remove the loop', title: 'Remove the loop',
        onclick: () => { setLoop(null); refocus(); } }, icon('close')),
      h('span', { class: 'loop-pause', role: 'radiogroup', 'aria-label': 'Pause between repeats' },
        h('span', { class: 'lbl' }, 'Pause between repeats'),
        ...[[0, 'Off'], [1, '1 s'], [2, '2 s']].map(([v, text]) => h('button', { type: 'button', role: 'radio',
          'aria-checked': String(loopPause() === v),
          onclick: () => { store.set('play.looppause', v ? String(v) : null); drawLoop(); refocus(); } }, text)))]
      : ['Click a measure to go there; drag across measures to loop them.']));
  }
  // pointer on the pages: a click jumps, a drag (to another measure) chooses a loop
  let press = null, swallowClick = false;
  stage.addEventListener('pointerdown', e => {
    if (!along || !canFollow || !player || e.button !== 0) return;
    const paper = e.target.closest('.play-page');
    const n = paper && measureAt(paper, e.clientX, e.clientY);
    if (!n) return;
    e.preventDefault();                               // no image drag or text selection

  stage.addEventListener('pointermove', e => {
    if (!press || e.pointerId !== press.id) return;

    press.moved = true;
    const under = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.classList && el.classList.contains('play-page'));
    const n = under && measureAt(under, e.clientX, e.clientY);

  });
  const endPress = e => {
    if (!press || e.pointerId !== press.id) return;

    press = null; swallowClick = true; setTimeout(() => { swallowClick = false; }, 0);
    if (e.type === 'pointercancel') { paintLoop(); return; }

      const value = loopOf(done.n, done.to);
      setLoop(value);

  };
  stage.addEventListener('pointerup', endPress);
  stage.addEventListener('pointercancel', endPress);

  function restoreLoop() {
    let saved = null;
    try { saved = JSON.parse(store.get('loop.' + name) || 'null'); } catch (e) {}
    // kept while the sheet's timing still has those measures at those times (a remade sheet may not)
    const fits = saved && spansOf(saved.a).some(x => Math.abs(x.a - saved.t0) < 0.01) && spansOf(saved.b).some(x => Math.abs(x.b - saved.t1) < 0.01);

    paintLoop(); drawLoop();
  }

  async function setAlong(on) {
    along = on;
    store.set('play.along', on ? '1' : null);
    alongButton.setAttribute('aria-pressed', String(on));
    videoPanel.classList.toggle('hidden', !on);
    if (!on) { view.classList.remove('along-on'); sizePanel(); }
    if (!on) {
      cancelAnimationFrame(ticking); player?.destroy(); player = null; playQueued = false; screenBox.replaceChildren(); showNote('');
      lit = null; held = false; draw();
      return;
    }
    sizePanel(); draw();
    screenBox.replaceChildren(h('div', { class: 'wait' }, 'Loading the video…'));
    try { timing = await api('/api/sheets/' + enc(name) + '/timing'); }
    catch (e) { timing = { how: null, lines: [], measures: [], range: { start: 0 }, video_id: sheet.video_id, local_video: null }; }
    if (!along) return;
    prepareFollow();
    restoreLoop();
    if (timing.video_id) {
      failedOver = false;
      player = youtubePlayer(screenBox, timing.video_id, timing.range || { start: 0 }, events);
      showNote(timing.how ? '' : 'This sheet cannot follow the video yet: the video plays without following.');
      showSource();
